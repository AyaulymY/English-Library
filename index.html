.editor-field textarea{min-height:78px;resize:vertical}

/* Mobile-first refinements: phone, tablet and desktop */
img, video, canvas, svg { max-width:100%; height:auto; }
.panel, .grade-card, .quick, .rule, .word-card, .author-credit { min-width:0; }
p, li, h1, h2, h3, h4, .example, .formula { overflow-wrap:anywhere; }
input, select, textarea { max-width:100%; }
button { touch-action:manipulation; }
button, input, select, textarea { min-height:42px; }
.nav button { min-height:42px; }
.topic-row { display:flex; flex-wrap:wrap; gap:7px; }
.answer { min-height:46px; }

  .sidebar {
    position:sticky; top:0; z-index:20; height:auto; width:100%;
    padding:9px 10px 8px; border-right:0; border-bottom:1px solid var(--line);

  .brand small { font-size:10px; }
  .nav {

  }
  .nav-label { display:none !important; }
  .nav button, .nav button:nth-of-type(n+5) {

    height:44px; padding:8px 4px; margin:0; justify-content:center;
    border-radius:11px;
  }
  .nav .nav-text { display:none !important; }
  .nav .ico { display:block; width:auto; font-size:19px; line-height:1; }
  .side-note { display:none !important; }
  main { padding:14px 12px 28px; width:100%; }
  .topbar { align-items:stretch; flex-direction:column; gap:9px; margin-bottom:16px; }
  .top-actions { display:flex; width:100%; gap:7px; }
  .search { flex:1 1 auto; min-width:0; width:0; padding:10px; }
  .lang-select { flex:0 0 auto; max-width:125px; padding:9px 7px; }
  .hero { grid-template-columns:minmax(0,1fr); padding:23px 18px; border-radius:20px; min-height:0; }
  .hero-art { right:5px; top:10px; font-size:42px; opacity:.35; }
  .hero h1 { font-size:clamp(28px,8vw,38px); max-width:100%; letter-spacing:-1px; }
  .hero p { max-width:100%; font-size:14px; }
  .grade-grid, .quick-grid, .content-grid { grid-template-columns:minmax(0,1fr) !important; }
  .grade-card { min-height:0; padding:16px; }
  .quick { min-height:100px; }
  .page-title { gap:10px; align-items:center; }
  .page-title h1 { font-size:clamp(22px,6vw,30px); }
  .page-title p { font-size:13px; }
  .page-title .round { flex:0 0 44px; width:44px; height:44px; }
  .panel { padding:16px 13px; border-radius:17px; }
  .stats { grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
  .answer-list { grid-template-columns:minmax(0,1fr); }
  .topic-row { gap:6px; }
  .topic-btn { max-width:100%; white-space:normal; }
  .word-card { padding:18px 12px; }
  .word-card h2 { font-size:25px; }
  .game-controls { flex-wrap:wrap; }
  .game-controls .btn, .game-controls button { flex:1 1 120px; }
  .editor-grid { grid-template-columns:minmax(0,1fr) !important; }
  .author-credit { padding:16px; }
  table { display:block; width:100%; overflow-x:auto; }
  footer { font-size:11px; text-align:center; padding:16px 4px; }
}
@media (min-width:621px) and (max-width:950px) {
  .app { grid-template-columns:68px minmax(0,1fr); }
  main { padding:20px 18px 35px; }
  .content-grid { grid-template-columns:minmax(0,1fr); }
  .nav button:nth-of-type(n+5) { display:flex; }
}

</style>

function loadCustomContent(){
  try{
    const saved=JSON.parse(localStorage.getItem(EDITOR_STORAGE_KEY)||'{}');
    if(saved && saved.grades) saved.grades.forEach(cg=>{
      const g=grades.find(x=>x.n===Number(cg.n));
      if(g){
        if(Array.isArray(cg.vocab))g.vocab=cg.vocab;
        if(typeof cg.grammar==='string')g.grammar=cg.grammar;
        if(Array.isArray(cg.topics))g.topics=cg.topics;
        if(typeof cg.desc==='string')g.desc=cg.desc;
      if(Array.isArray(cg.modules))g.modules=cg.modules;
      }
    });
  }catch(e){console.warn('Could not load saved library content',e)}
}

function grammarFormula(n){if(n<=4)return 'Subject + am / is / are + ...';if(n===5)return 'Subject + V1(s/es) · am/is/are + V-ing';if(n===6)return 'Subject + V2 / did not + V1';if(n===7)return 'Subject + was/were + V-ing';if(n===8)return 'Subject + have/has + V3';if(n===9)return 'If + condition, ... result';if(n===10)return 'Subject + be + V3 (passive)';return 'will / be going to / present forms for future'}
function grammarExample(n){return n<=4?'She is happy. / They are friends.':n===5?'She usually reads, but now she is reading.':n===6?'We visited the museum yesterday.':n===7?'I was studying at 7 p.m.':n===8?'I have finished my homework.':n===9?'If it rains, we will stay at home.':n===10?'The book was written in 2020.':'I will study / I am going to study.'}
function grammarQuestion(n){return n<=4?'They ___ my friends.':n===5?'Look! He ___ football now.':n===6?'Yesterday, we ___ to the park.':n===7?'At 8 pm, I ___ dinner.':n===8?'She ___ already finished her work.':n===9?'If I study, I ___ the test.':n===10?'English ___ in many countries.':'This time tomorrow, I ___ on a train.'}
function grammarOptions(n){return n<=4?['is','am','are','be']:n===5?['plays','is playing','play','played']:n===6?['go','went','gone','goes']:n===7?['cook','cooked','was cooking','am cooking']:n===8?['have','has','is','was']:n===9?['pass','passed','will pass','would passed']:n===10?['speaks','is spoken','spoke','speaking']:['travel','will travel','will be travelling','travelled']}
function grammarCorrect(n){return n<=4?2:n===5?1:n===6?1:n===7?2:n===8?1:n===9?2:n===10?1:2}

      <div class="editor-field"><label for="edit-topics">Topics / Тақырыптар (әр жолға бір тақырып)</label><textarea id="edit-topics">${esc(g.topics.join('\n'))}</textarea></div>
      <div class="editor-field"><label for="edit-grammar">Grammar topic / Грамматика тақырыбы</label><input id="edit-grammar" value="${esc(g.grammar)}" /></div>
      <div class="editor-actions"><button class="btn" onclick="saveGradeSettings()">Save changes / Сақтау</button><button class="btn secondary" onclick="renderEditorForm()">Cancel / Қайтару</button></div>
      <div class="feedback" id="editor-settings-message"></div>
    </section>
    <section class="panel">
      <h3>➕ Add vocabulary / Сөз қосу</h3>
      <p class="muted">Fields: English word, Kazakh meaning, Russian translation, emoji, example sentence.</p>

      <div class="editor-field"><label for="new-kz">Kazakh meaning / Қазақша</label><input id="new-kz" placeholder="қызыққұмар" /></div>
      <div class="editor-field"><label for="new-ru">Russian translation / Русский</label><input id="new-ru" placeholder="любознательный" /></div>
      <div class="editor-field"><label for="new-emoji">Emoji / Белгі</label><input id="new-emoji" value="📘" maxlength="8" /></div>
      <div class="editor-field"><label for="new-example">Example sentence / Мысал</label><input id="new-example" placeholder="She is curious about science." /></div>
      <div class="editor-actions"><button class="btn" onclick="addVocabulary()">Add word / Қосу</button></div>
      <div class="feedback" id="editor-word-message"></div>
    </section>
  </div>
  <section class="panel" style="margin-top:14px">
    <div class="section-head" style="margin-top:0"><div><h2>🗂️ Vocabulary list / Сөздік тізімі</h2><p>Сөзді өзгерту немесе өшіру үшін тиісті батырманы басыңыз.</p></div><span class="pill">${g.vocab.length} words</span></div>
    <div id="editor-word-list">${g.vocab.map((w,i)=>`<div class="editor-word"><div><strong>${esc(w[3])} ${esc(w[0])} — ${esc(w[1])}</strong><small>${esc(w[2])} · ${esc(w[4])}</small></div><div class="editor-actions"><button class="btn secondary" onclick="editVocabulary(${i})">Edit</button><button class="btn secondary" onclick="deleteVocabulary(${i})">Delete</button></div></div>`).join('')}</div>

    <div class="editor-field"><label for="edit-module-pages">Pages / Беттер</label><input id="edit-module-pages" value="${esc((g.modules||[])[0]?.pages||'')}" /></div>
    <div class="editor-field"><label for="edit-module-topics">Topics / Тақырыптар (әр жолға біреуден)</label><textarea id="edit-module-topics">${esc(((g.modules||[])[0]?.topics||[]).join('\n'))}</textarea></div>
    <div class="editor-field"><label for="edit-module-grammar">Grammar / Грамматика (әр жолға бір ереже)</label><textarea id="edit-module-grammar">${esc(((g.modules||[])[0]?.grammar||[]).join('\n'))}</textarea></div>
    <div class="editor-field"><label for="edit-module-vocab">Vocabulary / Сөздік бағыттары (әр жолға біреуден)</label><textarea id="edit-module-vocab">${esc(((g.modules||[])[0]?.vocabulary||[]).join('\n'))}</textarea></div>
    <div class="editor-field"><label for="edit-module-phonics">Phonics / Дыбыстау (әр жолға біреуден)</label><textarea id="edit-module-phonics">${esc(((g.modules||[])[0]?.phonics||[]).join('\n'))}</textarea></div>
    <div class="editor-actions"><button class="btn" onclick="saveModuleEditor()">Save module / Бөлімді сақтау</button></div>
    <div class="feedback" id="editor-module-message"></div>
  </section>
  <section class="panel" style="margin-top:14px">
    <h3>📦 Backup / Backup және қалпына келтіру</h3>
    <p class="muted">Экспортталған JSON файлын сақтап қойыңыз. Ол сынып материалдарын басқа браузерге көшіруге көмектеседі.</p>
    <div class="editor-actions"><button class="btn" onclick="exportLibrary()">Export content / Экспорттау</button><label class="btn secondary" for="import-library-file" style="display:inline-flex;align-items:center">Import content / Импорттау</label><input id="import-library-file" type="file" accept=".json,application/json" style="display:none" onchange="importLibrary(event)"/><button class="btn secondary" onclick="resetCustomContent()">Reset all edits / Өзгерістерді өшіру</button></div>
    <div class="feedback" id="editor-backup-message"></div>

function renderEditorForm(){currentGrade=Number(document.getElementById('edit-grade').value);render()}
function saveGradeSettings(){
  const g=getGrade();
  const title=document.getElementById('edit-title').value.trim();
  const desc=document.getElementById('edit-desc').value.trim();
  const topics=document.getElementById('edit-topics').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const grammarText=document.getElementById('edit-grammar').value.trim();
  if(!title||!grammarText){alert('Please enter a section title and grammar topic. / Бөлім атауы мен грамматика тақырыбын енгізіңіз.');return}
  g.title=title;g.desc=desc;g.topics=topics;g.grammar=grammarText;
  saveCustomContent();render();
}
function addVocabulary(){
  const word=document.getElementById('new-word').value.trim();
  const kz=document.getElementById('new-kz').value.trim();
  const ru=document.getElementById('new-ru').value.trim();
  const emoji=document.getElementById('new-emoji').value.trim()||'📘';
  const example=document.getElementById('new-example').value.trim();
  if(!word||!kz||!ru||!example){alert('Complete all vocabulary fields. / Барлық сөздік өрістерін толтырыңыз.');return}
  getGrade().vocab.push([word,kz,ru,emoji,example]);saveCustomContent();render();
}
function editVocabulary(i){
  const g=getGrade(),w=g.vocab[i];if(!w)return;
  const word=prompt('English word:',w[0]);if(word===null)return;
  const kz=prompt('Kazakh meaning:',w[1]);if(kz===null)return;
  const ru=prompt('Russian translation:',w[2]);if(ru===null)return;
  const emoji=prompt('Emoji:',w[3]);if(emoji===null)return;
  const example=prompt('Example sentence:',w[4]);if(example===null)return;
  if(!word.trim()||!kz.trim()||!ru.trim()||!example.trim()){alert('Word, translations and example are required.');return}
  g.vocab[i]=[word.trim(),kz.trim(),ru.trim(),emoji.trim()||'📘',example.trim()];saveCustomContent();render();
}
function deleteVocabulary(i){
  const g=getGrade();if(!g.vocab[i])return;
  if(confirm(`Delete “${g.vocab[i][0]}” from Grade ${g.n}?`)){g.vocab.splice(i,1);saveCustomContent();render()}
}

function loadModuleEditor(){
 const g=getGrade(),idx=Number(document.getElementById('edit-module-index')?.value||0),m=(g.modules||[])[idx];
 if(!m)return;
 document.getElementById('edit-module-name').value=m.name||'';
 document.getElementById('edit-module-pages').value=m.pages||'';
 document.getElementById('edit-module-topics').value=(m.topics||[]).join('\n');
 document.getElementById('edit-module-grammar').value=(m.grammar||[]).join('\n');
 document.getElementById('edit-module-vocab').value=(m.vocabulary||[]).join('\n');
 document.getElementById('edit-module-phonics').value=(m.phonics||[]).join('\n');
}
function saveModuleEditor(){
 const g=getGrade(),idx=Number(document.getElementById('edit-module-index').value),m=(g.modules||[])[idx];if(!m)return;
 const lines=id=>document.getElementById(id).value.split('\n').map(x=>x.trim()).filter(Boolean);
 m.name=document.getElementById('edit-module-name').value.trim()||m.name;
 m.pages=document.getElementById('edit-module-pages').value.trim();
 m.topics=lines('edit-module-topics');m.grammar=lines('edit-module-grammar');m.vocabulary=lines('edit-module-vocab');m.phonics=lines('edit-module-phonics');
 saveCustomContent();render();
}

function exportLibrary(){
  const payload={version:1,updatedAt:new Date().toISOString(),grades:grades.map(g=>({n:g.n,title:g.title,desc:g.desc,grammar:g.grammar,topics:g.topics,vocab:g.vocab,modules:g.modules}))};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='english-library-content.json';a.click();URL.revokeObjectURL(url);
}
function importLibrary(event){
  const file=event.target.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!Array.isArray(data.grades))throw new Error('Invalid file');
      data.grades.forEach(cg=>{
        const g=grades.find(x=>x.n===Number(cg.n));if(!g)return;
        if(typeof cg.title==='string')g.title=cg.title;
        if(typeof cg.desc==='string')g.desc=cg.desc;
      if(Array.isArray(cg.modules))g.modules=cg.modules;
        if(typeof cg.grammar==='string')g.grammar=cg.grammar;
        if(Array.isArray(cg.topics))g.topics=cg.topics.filter(x=>typeof x==='string');
        if(Array.isArray(cg.vocab)&&cg.vocab.every(w=>Array.isArray(w)&&w.length>=5))g.vocab=cg.vocab;
        if(Array.isArray(cg.modules))g.modules=cg.modules;
      });
      saveCustomContent();render();
      alert('Content imported successfully. / Материалдар импортталды.');
    }catch(e){alert('Could not import this JSON file. Please use a file exported from English Library. / JSON файлын оқу мүмкін болмады.')}
  };
  reader.readAsText(file);
}
function resetCustomContent(){
  if(!confirm('Remove saved edits and restore the original prototype content in this browser? Export a backup first if needed.'))return;
  localStorage.removeItem(EDITOR_STORAGE_KEY);location.reload();
}

function searchPage(){let results=[];grades.forEach(g=>{if(('grade '+g.n+' '+g.title+' '+g.grammar+' '+g.topics.join(' ')).toLowerCase().includes(searchTerm))results.push({title:`Grade ${g.n} · ${g.title}`,desc:`${g.range} · ${g.grammar}`,action:`openGrade(${g.n})`});g.vocab.forEach(w=>{if(w.join(' ').toLowerCase().includes(searchTerm))results.push({title:`${w[3]} ${w[0]} — ${w[1]} / ${w[2]}`,desc:`Grade ${g.n} · ${w[4]}`,action:`openGrade(${g.n});setView('vocabulary')`})})});return `${pageTitle('🔎','Search results','Іздеу нәтижелері / Search the library')}<div class="panel">${results.length?results.map(r=>`<div class="rule" style="cursor:pointer" onclick="${r.action}"><h4>${esc(r.title)}</h4><p>${esc(r.desc)}</p></div>`).join(''):'<div class="empty-note">Нәтиже табылмады. Басқа сөзбен іздеп көр.</div>'}</div>`}
function render(){document.getElementById('breadcrumb').textContent='English Library / '+(currentView==='grade'?'Grade '+currentGrade:allViews[currentView]||'Search');let g=getGrade();if(currentView==='home')content.innerHTML=home();else if(currentView==='grade')content.innerHTML=gradeHeader()+gradeTabs()+`<div class="quick-grid">${[['vocabulary','🔤','Vocabulary','Сөздік және аударма'],['grammar','📘','Grammar','Ереже мен мысал'],['tasks','✏️','Tasks','Деңгейлік тапсырмалар'],['games','🎮','Games','Ойындар мен карточкалар'],['feedback','💬','Feedback','Кері байланыс'],['teacher','🧑‍🏫','Teacher resources','Мұғалімге арналған']].map(([v,e,t,d])=>`<button class="quick" onclick="setView('${v}')"><div class="big">${e}</div><strong>${t}</strong><small>${d}</small></button>`).join('')}</div>`;else if(currentView==='vocabulary')content.innerHTML=vocab();else if(currentView==='grammar')content.innerHTML=grammar();else if(currentView==='tasks'){content.innerHTML=tasks();renderQuiz()}else if(currentView==='games')content.innerHTML=games();else if(currentView==='feedback')content.innerHTML=feedback();else if(currentView==='teacher')content.innerHTML=teacher();else if(currentView==='editor')content.innerHTML=editor();else if(currentView==='search')content.innerHTML=searchPage();content.innerHTML+=`<footer class="site-copyright">© 2026 Язитқызы Аяулым · Ағылшын тілі пәнінің мұғалімі, педагог-модератор · English Library<br>Автордың рұқсатынсыз материалдарды авторлығын өзгертумен жариялауға болмайды.</footer>`}
function setTopic(t){currentTopic=t;flashIndex=0;render()}function nextWord(){flashIndex++;render()}function prevWord(){flashIndex=(flashIndex+getGrade().vocab.length-1)%getGrade().vocab.length;render()}
render();
